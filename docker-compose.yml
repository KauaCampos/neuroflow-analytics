services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neuroflow}
      POSTGRES_USER: ${POSTGRES_USER:-neuroflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neuroflow_dev_password}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/neuroflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-neuroflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-neuroflow_dev_password}
      APP_JWT_SECRET: ${JWT_SECRET:-change-me-to-a-strong-secret-with-at-least-32-characters}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  postgres_data:
